services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    build: .:requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file: .env
    depends_on:
      - mariadb
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress:/var/www/html
    networks:
      inception
    restart: always

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: always

  volumes:
    mariadb:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DATA_PATH}/mariadb
    wordpress:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DATA_PATH}/wordpress
    
  networks:
    inception:
      driver: bridge
  
  secrets:
    db_password:
      file: ../secrets/db_password.txt
    db_root_password:
      file: ../secrets/db_root_password.txt
    wp_admin_password:
      file: ../secrets/wp_admin_password.txt
    wp_user_password:
      file: ../secrets/wp_user_password.txt
