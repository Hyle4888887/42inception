server {
	listen 443 ssl;
	listen [::]443 ssl;
	server_name mpoirier.42.fr;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/nginx/ssl/inception.crt;
	ssl_certifiacte_key /etc/nginx/ssl/inception.key;

	root /var/www/html;
	index index.php;

	location / {
		try_file $uri $uri/ =404;
	}
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass wordpress:9000;
	}
}
